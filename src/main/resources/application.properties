spring.application.name=backend
# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/licensemanagement
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ============================================
# EMAIL CONFIGURATION (For testing, use Mailtrap)
# ============================================


# ============================================
# CORS CONFIGURATION
# ============================================
cors.allowed-origins=http://localhost:3000

# ============================================
# CACHE CONFIGURATION
# ============================================
spring.cache.type=caffeine
spring.cache.cache-names=users,licenses
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ============================================
# LOGGING
# ============================================
logging.level.com.licensemanagement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
# ============================================
# APP BASE URL FOR QR CODES & FRONTEND
# ============================================
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
# ============================================
# SERVER
# ============================================
# ============================================
# EMAIL CONFIGURATION
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080
# ============================================
# SECURITY CONFIGURATION
# ============================================
app.security.license.hmac-secret=${HMAC_SECRET}
qr.activation.token.ttl=5m

# ============================================
# WEBHOOK CONFIGURATION
# ============================================
app.admin.webhook-url=${ADMIN_WEBHOOK_URL:}

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
license.validation.hmac-secret=${HMAC_SECRET:default-dev-hmac-secret-key-that-should-be-changed}
# RSA Keys for Offline/QR Activation
app.security.rsa.private-key=${RSA_PRIVATE_KEY:}
app.security.rsa.public-key=${RSA_PUBLIC_KEY:}


# ============================================
# FR-10: KEY HIERARCHY CONFIGURATION
# ============================================
# Root key cipher (AES-256-GCM encrypted root key) — populated after /api/admin/key-hierarchy/init
app.security.root-key-cipher=${ROOT_KEY_CIPHER:}
app.security.root-key-iv=${ROOT_KEY_IV:}
# Audit trail signing key (RSA private key sealed with root key) — populated after init
app.security.audit-signing-key=${AUDIT_SIGNING_KEY:}
