<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbind Request Update</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; margin: 0; padding: 0; background-color: #f9f9f9; }
        .container { max-width: 600px; margin: 20px auto; padding: 0; background-color: #ffffff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header { background-color: #0f52ba; color: white; padding: 25px 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 30px 25px; }
        .footer { background-color: #f5f5f5; padding: 15px; text-align: center; font-size: 12px; color: #888; border-radius: 0 0 8px 8px; border-top: 1px solid #eee; }
        .badge-approved { display: inline-block; padding: 6px 12px; background-color: #e8f5e9; color: #2e7d32; font-weight: bold; border-radius: 4px; }
        .badge-rejected { display: inline-block; padding: 6px 12px; background-color: #ffebee; color: #c62828; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 style="margin: 0;">Unbind Request Update</h2>
    </div>
    <div class="content">
        <p>Dear <strong>{customerName}</strong>,</p>
        <p>An administrator has reviewed your device unbind request.</p>
        <p><strong>Device:</strong> {deviceName}</p>
        <p><strong>License:</strong> {maskedKey}</p>
        <p><strong>Status:</strong> <span class="{statusClass}">{statusText}</span></p>
        <p>{statusMessage}</p>
        <br>
        <p>Best regards,<br><strong>LockStrata Team</strong></p>
    </div>
    <div class="footer">
        <p>This is an automated notification based on your notification preferences.</p>
    </div>
</div>
</body>
</html>
