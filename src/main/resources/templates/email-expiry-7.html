<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Expiry Reminder</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; margin: 0; padding: 0; background-color: #f9f9f9; }
        .container { max-width: 600px; margin: 20px auto; padding: 0; background-color: #ffffff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header { background-color: #FF9800; color: white; padding: 25px 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 30px 25px; }
        .footer { background-color: #f5f5f5; padding: 15px; text-align: center; font-size: 12px; color: #888; border-radius: 0 0 8px 8px; border-top: 1px solid #eee; }
        .days { font-size: 28px; font-weight: bold; color: #FF9800; }
        .label { font-weight: bold; color: #555; }
        .license-key { font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 style="margin: 0;">⚠️ License Expires in 7 Days</h1>
    </div>
    <div class="content">
        <p>Dear <strong>{customerName}</strong>,</p>
        <p>Your license for <strong>{productName}</strong> will expire in <span class="days">7 days</span>.</p>
        <p><span class="label">Expiry Date:</span> {expiryDate}</p>
        <p>Please renew your license to continue using the software.</p>
        <br>
        <p>Best regards,<br><strong>License Management Team</strong></p>
    </div>
    <div class="footer">
        <p>This is an automated message. Please do not reply to this email.</p>
    </div>
</div>
</body>
</html>
